# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [dev, master, 'dev20[0-9][0-9]']
    paths:
      - R/**
      - tests/**
      - data/**
      - data-raw/**
      - inst/**
      - .github/workflows/check-standard.yaml
  pull_request:
    branches: [dev, master, 'dev20[0-9][0-9]']
    paths:
      - R/**
      - tests/**
      - data/**
      - data-raw/**
      - inst/**
      - .github/workflows/check-standard.yaml

name: Check package

env:
  # Tests that set up data for other tests
  SETUP_TESTS: "data.handler"
  # Heavy tests that run in parallel (must match matrix.heavy-test values below)
  HEAVY_TESTS_PATTERN: "future-dummy-data|future-part"

jobs:
  check-package:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
#          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
#          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
#          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes", "--no-tests")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
#	  upload_snapshots:true

  setup-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat

      - name: Generate test data
        run: |
          devtools::test(filter = "${{ env.SETUP_TESTS }}", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Upload test data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-setup
          path: tests/testthat/*.rda
          retention-days: 1

  heavy-tests:
    runs-on: ubuntu-latest
    needs: setup-data
    strategy:
      fail-fast: false
      matrix:
        # IMPORTANT: Keep these values in sync with env.HEAVY_TESTS_PATTERN above
        # Pattern format: "test1|test2" must match matrix values
        heavy-test:
          - "future-dummy-data"
          - "future-part"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat

      - name: Download setup test data
        uses: actions/download-artifact@v4
        with:
          name: test-data-setup
          path: tests/testthat/

      - name: Run heavy test - ${{ matrix.heavy-test }}
        run: |
          devtools::test(filter = "${{ matrix.heavy-test }}", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Upload generated test data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-heavy-${{ matrix.heavy-test }}
          path: tests/testthat/*.rda
          retention-days: 1

  run-tests:
    runs-on: ubuntu-latest
    needs: [setup-data, heavy-tests]
    strategy:
      fail-fast: false
      matrix:
        test-group: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat

      - name: Download setup test data
        uses: actions/download-artifact@v4
        with:
          name: test-data-setup
          path: tests/testthat/

      # Download artifacts from all heavy tests
      # IMPORTANT: These names must match env.HEAVY_TESTS_PATTERN matrix values
      - name: Download heavy test data - future-dummy-data
        uses: actions/download-artifact@v4
        with:
          name: test-data-heavy-future-dummy-data
          path: tests/testthat/

      - name: Download heavy test data - future-part
        uses: actions/download-artifact@v4
        with:
          name: test-data-heavy-future-part
          path: tests/testthat/

      - name: Test group ${{ matrix.test-group }}
        run: |
          test_files <- sort(list.files("tests/testthat", pattern = "^test-", full.names = TRUE))

          # Exclude heavy tests and setup tests
          # Pattern: SETUP_TESTS | HEAVY_TESTS_PATTERN
          exclude_pattern <- paste0("${{ env.SETUP_TESTS }}", "|", "${{ env.HEAVY_TESTS_PATTERN }}")
          test_files <- test_files[!grepl(exclude_pattern, test_files)]

          n <- length(test_files)
          group_size <- ceiling(n / 3)
          group <- as.numeric("${{ matrix.test-group }}")
          start_idx <- (group - 1) * group_size + 1
          end_idx <- min(group * group_size, n)
          selected_files <- test_files[start_idx:end_idx]

          # Build filter pattern from selected files
          file_names <- basename(selected_files)
          file_names <- gsub("test-", "", file_names)
          file_names <- gsub(".R$", "", file_names)
          filter_pattern <- paste0(file_names, collapse = "|")

          # Run tests with filter
          devtools::test(filter = filter_pattern, stop_on_failure = TRUE)
        shell: Rscript {0}

  build-vignettes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::rmarkdown, any::knitr
          dependencies: '"hard"'

      - name: Build vignettes
        run: |
          lapply(
            Sys.glob("vignettes/*.Rmd"),
            rmarkdown::render,
            output_dir = "vignettes/output"
          )
        shell: Rscript {0}
